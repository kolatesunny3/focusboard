[package]
name = "focusboard"
version = "0.1.0"
edition = "2024"
description = "Lightweight Windows task planner with user-defined fields"
rust-version = "1.92"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"

[dependencies]
chrono = "0.4.45"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
# Minimal Slint feature set: no femtoVG (GL) renderer, no accessibility, no tray,
# no extra platform backends -- keeps the binary and RAM footprint down.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-18",
] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18.1"
